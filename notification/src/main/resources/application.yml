spring:
  application:
    name: notification
  cloud:
    function:
      definition: orderCreated
    stream:
      bindings:
        orderCreated-in-0:
          destination: order.exchange
          group: notification-group
          content-type: application/json
      kafka:
        binder:
          # order-service publishes to ${KAFKA_BROKERS:localhost:9092}; both sides must
          # agree. This was hardcoded to localhost:9092 while order-service used
          # kafka:9092, so the consumer silently received nothing under Docker.
          brokers: ${KAFKA_BROKERS:localhost:9092}

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  tracing:
    sampling:
      probability: 1.0
